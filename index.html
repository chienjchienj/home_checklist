<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#f97316"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="回家任務"/>
  <title>回家任務清單 🏠</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --orange:  #f97316;
      --yellow:  #fbbf24;
      --green:   #22c55e;
      --blue:    #3b82f6;
      --pink:    #ec4899;
      --purple:  #a855f7;
      --bg:      #fff7ed;
      --card:    #ffffff;
      --text:    #1c1917;
      --dim:     #78716c;
      --radius:  20px;
      --font:    'Nunito', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      /* iOS：確保 body 本身可接收 touch */
      cursor: pointer;
    }

    /* ── 彩色泡泡背景 ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 15% 20%, rgba(251,191,36,.25) 0%, transparent 40%),
        radial-gradient(circle at 85% 10%, rgba(236,72,153,.2)  0%, transparent 35%),
        radial-gradient(circle at 60% 85%, rgba(59,130,246,.2)  0%, transparent 40%),
        radial-gradient(circle at 10% 80%, rgba(34,197,94,.2)   0%, transparent 35%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── 大彩虹 ── */
    body::after {
      content: '';
      position: fixed;
      bottom: -30vh;
      left: 50%;
      transform: translateX(-50%);
      width: 180vw;
      height: 180vw;
      background: radial-gradient(ellipse at 50% 100%,
        transparent               28%,
        rgba(148,0,211,.18)       29%, rgba(148,0,211,.18)   32%,
        rgba(75,0,130,.18)        32%, rgba(75,0,130,.18)    35%,
        rgba(0,0,255,.18)         35%, rgba(0,0,255,.18)     38%,
        rgba(0,200,80,.2)         38%, rgba(0,200,80,.2)     41%,
        rgba(255,255,0,.22)       41%, rgba(255,255,0,.22)   44%,
        rgba(255,140,0,.22)       44%, rgba(255,140,0,.22)   47%,
        rgba(255,30,30,.2)        47%, rgba(255,30,30,.2)    50%,
        transparent               51%
      );
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 100px;
      padding-top: env(safe-area-inset-top);
    }

    /* ── Header ── */
    .header {
      padding: 20px 20px 12px;
      text-align: center;
    }

    .header-emoji {
      font-size: 56px;
      line-height: 1;
      display: block;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 900;
      color: var(--orange);
      margin-top: 6px;
      text-shadow: 3px 3px 0 rgba(249,115,22,.2);
    }

    .date-str {
      font-size: 14px;
      color: var(--dim);
      font-weight: 700;
      margin-top: 4px;
    }

    /* ── 進度條 ── */
    .progress-wrap {
      margin: 0 20px 16px;
      background: #e7e5e4;
      border-radius: 99px;
      height: 22px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 4px rgba(0,0,0,.1);
    }

    .progress-bar {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      transition: width .5s cubic-bezier(.34,1.56,.64,1);
      position: relative;
    }

    .progress-bar::after {
      content: '⭐';
      position: absolute;
      right: -2px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 18px;
      line-height: 1;
    }

    .progress-label {
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: var(--dim);
      margin-bottom: 16px;
    }

    /* ── 清單容器 ── */
    .list-wrap { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

    /* ── 單一項目卡片 ── */
    .item-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
      border: 3px solid transparent;
      transition: all .25s ease;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      /* iOS touch-action */
      touch-action: manipulation;
    }

    .item-card.done {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border-color: var(--green);
    }

    .item-card:active { transform: scale(.97); }

    .check-circle {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 3px solid #e7e5e4;
      background: #f5f5f4;
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: all .3s cubic-bezier(.34,1.56,.64,1);
    }

    .item-card.done .check-circle {
      background: var(--green);
      border-color: var(--green);
      transform: scale(1.1);
    }

    .item-card.done .check-circle::after {
      content: '✓';
      font-size: 26px;
      color: white;
      font-weight: 900;
    }

    .item-card:not(.done) .check-circle .item-icon { display: block; }
    .item-card.done .check-circle .item-icon { display: none; }

    .item-text {
      flex: 1;
      font-size: 18px;
      font-weight: 800;
      transition: all .2s;
    }

    .item-card.done .item-text {
      text-decoration: line-through;
      color: var(--dim);
    }

    .item-delete {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      opacity: 0;
      transition: opacity .2s;
      padding: 4px;
      border-radius: 8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .edit-mode .item-delete { opacity: 1; }

    /* ── 新增項目 ── */
    .add-wrap {
      margin: 20px 16px 0;
      display: flex;
      gap: 10px;
    }

    .add-wrap input {
      flex: 1;
      padding: 14px 18px;
      border-radius: var(--radius);
      border: 3px solid #e7e5e4;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 700;
      background: var(--card);
      outline: none;
      transition: border-color .2s;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .add-wrap input:focus { border-color: var(--orange); }

    .add-wrap button {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: var(--orange);
      border: none;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(249,115,22,.4);
      transition: all .2s;
      display: grid;
      place-items: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .add-wrap button:active { transform: scale(.93); }

    /* ── 底部按鈕列
         iOS 修正：移除 backdrop-filter，改用實心背景；
         pointer-events: auto 確保觸控穿透不發生
    ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      /* 移除 backdrop-filter，改用不透明背景，避免 iOS 點擊穿透 */
      background: #fff3e0;
      border-top: 2px solid rgba(249,115,22,.2);
      display: flex;
      gap: 10px;
      z-index: 10;
      pointer-events: auto;
    }

    .btn {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-family: var(--font);
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      /* 確保 iOS 可點擊 */
      position: relative;
      z-index: 11;
    }

    .btn:active { transform: scale(.96); }

    .btn-reset {
      background: #fee2e2;
      color: #ef4444;
    }

    .btn-edit {
      background: #eff6ff;
      color: var(--blue);
    }

    .btn-edit.active {
      background: var(--blue);
      color: white;
    }

    .btn-history {
      background: #f3e8ff;
      color: var(--purple);
    }

    /* ── 覆蓋層通用 ── */
    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      /* iOS：touch 事件 */
      touch-action: none;
    }

    .panel-overlay.open { display: flex; }

    .panel {
      background: var(--bg);
      width: 100%;
      max-width: 480px;
      border-radius: 28px 28px 0 0;
      padding: 20px 20px max(20px,env(safe-area-inset-bottom));
      max-height: 75dvh;
      overflow-y: auto;
      animation: slideUp .3s ease;
      touch-action: pan-y;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }

    .panel-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 16px;
      text-align: center;
    }

    /* ── 歷史紀錄 ── */
    .history-day {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .history-day-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--orange);
      margin-bottom: 8px;
    }

    .history-item {
      font-size: 14px;
      font-weight: 700;
      color: var(--dim);
      padding: 3px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-item.done-item { color: var(--green); }

    .close-btn {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 16px;
      background: var(--orange);
      color: white;
      border: none;
      font-family: var(--font);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── 密碼輸入面板 ── */
    .pwd-panel {
      padding: 28px 20px 20px;
      text-align: center;
    }

    .pwd-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .pwd-subtitle {
      font-size: 14px;
      color: var(--dim);
      font-weight: 700;
      margin-bottom: 24px;
    }

    /* 數字鍵盤顯示區 */
    .pwd-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pwd-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 3px solid #e7e5e4;
      background: transparent;
      transition: all .2s cubic-bezier(.34,1.56,.64,1);
    }

    .pwd-dot.filled {
      background: var(--orange);
      border-color: var(--orange);
      transform: scale(1.15);
    }

    .pwd-dot.error {
      background: #ef4444;
      border-color: #ef4444;
      animation: shake .35s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* 數字鍵盤 */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 280px;
      margin: 0 auto;
    }

    .numpad-btn {
      height: 64px;
      border-radius: 16px;
      border: none;
      font-family: var(--font);
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      transition: all .15s;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 3px 8px rgba(0,0,0,.1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .numpad-btn:active { transform: scale(.92); background: #f5f5f4; }

    .numpad-btn.del {
      font-size: 20px;
      background: #fee2e2;
      color: #ef4444;
    }

    .numpad-btn.empty {
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .pwd-error-msg {
      margin-top: 16px;
      font-size: 14px;
      font-weight: 800;
      color: #ef4444;
      min-height: 20px;
    }

    /* ── 全部完成慶祝畫面 ── */
    #celebrate {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #fef9c3, #fde68a, #fed7aa);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #celebrate.show { display: flex; }

    .celebrate-emoji {
      font-size: 80px;
      animation: spinBounce 1s ease infinite alternate;
    }

    @keyframes spinBounce {
      from { transform: scale(.9) rotate(-10deg); }
      to   { transform: scale(1.1) rotate(10deg); }
    }

    .celebrate-title {
      font-size: 36px;
      font-weight: 900;
      color: var(--orange);
      text-align: center;
      text-shadow: 3px 3px 0 rgba(249,115,22,.3);
    }

    .celebrate-sub {
      font-size: 18px;
      font-weight: 800;
      color: #92400e;
      text-align: center;
    }

    .celebrate-close {
      margin-top: 20px;
      padding: 16px 40px;
      border-radius: 20px;
      background: var(--orange);
      color: white;
      border: none;
      font-family: var(--font);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(249,115,22,.4);
      animation: pulse 1.5s infinite;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .confetti {
      position: absolute;
      width: 12px; height: 12px;
      border-radius: 3px;
      animation: fall linear infinite;
      pointer-events: none;
    }

    @keyframes fall {
      from { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      to   { transform: translateY(100dvh) rotate(720deg); opacity: 0; }
    }

    /* ── iOS 安裝提示 ── */
    #ios-banner {
      margin: 16px;
      padding: 14px 16px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border-radius: 16px;
      border: 2px solid #93c5fd;
      font-size: 14px;
      font-weight: 700;
      color: #1e40af;
      display: none;
      line-height: 1.6;
    }

    .item-card {
      opacity: 0;
      transform: translateX(-20px);
      animation: slideIn .35s ease forwards;
    }

    @keyframes slideIn {
      to { opacity: 1; transform: none; }
    }

    /* ── Icon 選擇器 ── */
    .icon-category {
      margin-bottom: 14px;
    }

    .icon-category-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--dim);
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 2px;
    }

    .icon-picker-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .icon-option {
      aspect-ratio: 1;
      border-radius: 14px;
      border: 3px solid transparent;
      background: var(--card);
      font-size: 28px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all .15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 2px 6px rgba(0,0,0,.08);
    }

    .icon-option:active { transform: scale(.85); }

    .icon-option.selected {
      border-color: var(--orange);
      background: #fff7ed;
      box-shadow: 0 0 0 3px rgba(249,115,22,.25);
    }

    /* ── 滑動解鎖 ── */
    .slide-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 0;
      background: linear-gradient(90deg, #dcfce7, #f0fdf4);
      border-radius: var(--radius);
      pointer-events: none;
      z-index: 0;
      transition: width .4s cubic-bezier(.34,1.56,.64,1);
    }

    .item-card .check-circle,
    .item-card .item-text,
    .item-card .item-name-input,
    .item-card .item-delete,
    .item-card .slide-hint { position: relative; z-index: 1; }

    .slide-hint {
      font-size: 15px;
      color: #c8c4c0;
      pointer-events: none;
      flex-shrink: 0;
      letter-spacing: -2px;
    }

    .item-card:not(.done):not(.edit-card) .check-circle {
      cursor: ew-resize;
      touch-action: none;
    }

    /* 編輯模式：任務名稱變成可輸入 */
    .edit-mode .item-card .item-text {
      text-decoration: none !important;
      color: var(--text) !important;
    }

    .item-name-input {
      flex: 1;
      font-family: var(--font);
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--orange);
      outline: none;
      padding: 2px 0;
      width: 100%;
    }

    /* 編輯模式下 check-circle 可點擊選 icon */
    .edit-mode .item-card .check-circle {
      cursor: pointer;
      position: relative;
    }

    .edit-mode .item-card .check-circle::after {
      content: '✏️';
      position: absolute;
      bottom: -4px;
      right: -4px;
      font-size: 13px;
      background: white;
      border-radius: 50%;
      line-height: 1;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }
  </style>
</head>
<body>

<!-- 慶祝畫面 -->
<div id="celebrate">
  <span class="celebrate-emoji">🏆</span>
  <div class="celebrate-title">太棒了！！！</div>
  <div class="celebrate-sub">今天所有任務都完成了！<br>你真是超級棒的孩子！⭐</div>
  <button class="celebrate-close" id="celebrate-close-btn">謝謝！繼續加油 🚀</button>
</div>

<!-- 歷史紀錄面板 -->
<div class="panel-overlay" id="history-overlay">
  <div class="panel">
    <div class="panel-title">📅 歷史紀錄</div>
    <div id="history-list"></div>
    <button class="close-btn" id="close-history-btn">關閉</button>
  </div>
</div>

<!-- 密碼輸入面板 -->
<div class="panel-overlay" id="pwd-overlay">
  <div class="panel pwd-panel">
    <div class="pwd-title">🔒 輸入密碼</div>
    <div class="pwd-subtitle">請輸入 4 位數密碼才能編輯</div>
    <div class="pwd-dots" id="pwd-dots">
      <div class="pwd-dot" id="dot-0"></div>
      <div class="pwd-dot" id="dot-1"></div>
      <div class="pwd-dot" id="dot-2"></div>
      <div class="pwd-dot" id="dot-3"></div>
    </div>
    <div class="numpad" id="numpad">
      <!-- 由 JS 產生 -->
    </div>
    <div class="pwd-error-msg" id="pwd-error"></div>
    <button class="close-btn" id="close-pwd-btn" style="margin-top:20px">取消</button>
  </div>
</div>

<!-- Icon 選擇器面板 -->
<div class="panel-overlay" id="icon-overlay">
  <div class="panel">
    <div class="panel-title">🎨 選擇圖示</div>
    <div class="icon-picker-grid" id="icon-picker-grid"></div>
    <button class="close-btn" id="close-icon-btn" style="margin-top:20px">取消</button>
  </div>
</div>

<div class="app">
  <div class="header">
    <span class="header-emoji">🏠</span>
    <h1>回家任務清單</h1>
    <div class="date-str" id="date-str"></div>
  </div>

  <div id="ios-banner">
    📲 想加到主畫面嗎？<br>
    點 Safari 的 <strong>分享 □↑</strong> → <strong>加入主畫面</strong>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progress-bar" style="width:0%"></div>
  </div>
  <div class="progress-label" id="progress-label">還沒開始，加油！💪</div>

  <div class="list-wrap" id="list-wrap"></div>

  <div class="add-wrap" id="add-wrap" style="display:none">
    <input id="new-item-input" type="text" placeholder="新增任務..." maxlength="20"/>
    <button id="add-item-btn">➕</button>
  </div>
</div>

<!-- 底部按鈕 -->
<div class="bottom-bar">
  <button class="btn btn-reset" id="btn-reset">🔄 重置</button>
  <button class="btn btn-edit" id="btn-edit">✏️ 編輯</button>
  <button class="btn btn-history" id="btn-history">📅 紀錄</button>
</div>

<script>
// ══════════════════════════════════════
//  設定
// ══════════════════════════════════════
const PASSWORD = '1234';  // ← 在這裡修改密碼

const STORAGE_ITEMS   = 'checklist-items-v1';
const STORAGE_DONE    = 'checklist-done-v1';
const STORAGE_HISTORY = 'checklist-history-v1';

const DEFAULTS = [
  { icon: '👟', text: '換居家服' },
  { icon: '🍱', text: '吃點心' },
  { icon: '📚', text: '寫功課' },
  { icon: '🎒', text: '整理書包' },
  { icon: '🛁', text: '洗澡' },
  { icon: '😴', text: '準備睡覺' },
];

const ICON_CATEGORIES = [
  { label: '📖 學習 & 文具', icons: ['📚','✏️','📝','📖','🖊️','📐','📏','🔬','🧪','💡','🖥️','📓'] },
  { label: '🍱 食物 & 飲料', icons: ['🍱','🍎','🥛','🧃','🍪','🍕','🍜','🥗','🍰','🍫','🥤','🍳'] },
  { label: '👟 衣物 & 生活', icons: ['👟','👕','🧦','🎒','🛁','🪥','🧴','🧹','🛏️','🪴','🧺','🚿'] },
  { label: '⚽ 運動 & 活動', icons: ['🏃','⚽','🏊','🚴','🧘','🏋️','🎯','🏸','🤸','🧗','🛹','🥊'] },
  { label: '🎮 娛樂 & 興趣', icons: ['🎮','🎵','🎨','🎭','📺','🎧','📷','🎹','🎸','🎲','🧩','📚'] },
  { label: '🐶 動物 & 自然', icons: ['🐶','🐱','🐰','🦊','🐸','🦋','🌸','🌈','⭐','🌟','🌿','🌺'] },
  { label: '😊 表情 & 符號', icons: ['😴','😊','💪','🔥','⚡','🎉','🏆','❤️','🌙','☀️','✨','🎀'] },
];
const ICONS = ICON_CATEGORIES.flatMap(c => c.icons);


let items   = [];
let doneSet = new Set();
let editMode = false;
let celebrated = false;

// ══════════════════════════════════════
//  工具
// ══════════════════════════════════════
function todayKey() {
  return new Date().toLocaleDateString('zh-TW', {timeZone:'Asia/Taipei'})
    .replace(/\//g, '-');
}

// iOS 安全的事件綁定：同時綁 click + touchend，並排除滑動手勢
function tap(el, fn) {
  if (!el) return;
  let startX, startY, moved, touched;
  el.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    moved = false;
    touched = false;
  }, { passive: true });
  el.addEventListener('touchmove', function(e) {
    if (!moved) {
      const dx = Math.abs(e.touches[0].clientX - startX);
      const dy = Math.abs(e.touches[0].clientY - startY);
      if (dx > 8 || dy > 8) moved = true;
    }
  }, { passive: true });
  el.addEventListener('touchend', function(e) {
    if (moved) return;
    e.preventDefault();
    touched = true;
    fn(e);
  }, { passive: false });
  el.addEventListener('click', function(e) {
    if (touched) { touched = false; return; }
    fn(e);
  });
}

// ══════════════════════════════════════
//  密碼模組
// ══════════════════════════════════════
let pwdInput = '';

function buildNumpad() {
  const pad = document.getElementById('numpad');
  pad.innerHTML = '';
  const keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'numpad-btn' + (k === '' ? ' empty' : k === '⌫' ? ' del' : '');
    btn.textContent = k;
    if (k !== '') {
      tap(btn, () => onNumpadPress(k));
    }
    pad.appendChild(btn);
  });
}

function onNumpadPress(k) {
  if (k === '⌫') {
    pwdInput = pwdInput.slice(0, -1);
  } else if (pwdInput.length < 4) {
    pwdInput += k;
  }
  updateDots();
  if (pwdInput.length === 4) {
    setTimeout(checkPassword, 120);
  }
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot-' + i);
    dot.classList.toggle('filled', i < pwdInput.length);
    dot.classList.remove('error');
  }
  document.getElementById('pwd-error').textContent = '';
}

function checkPassword() {
  if (pwdInput === PASSWORD) {
    closePwdPanel();
    activateEditMode();
  } else {
    // 錯誤動畫
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('dot-' + i);
      dot.classList.remove('filled');
      dot.classList.add('error');
    }
    document.getElementById('pwd-error').textContent = '密碼錯誤，請再試一次 😅';
    setTimeout(() => {
      pwdInput = '';
      updateDots();
    }, 700);
  }
}

function showPwdPanel() {
  pwdInput = '';
  updateDots();
  document.getElementById('pwd-error').textContent = '';
  document.getElementById('pwd-overlay').classList.add('open');
}

function closePwdPanel() {
  document.getElementById('pwd-overlay').classList.remove('open');
}

// ══════════════════════════════════════
//  初始化
// ══════════════════════════════════════
function init() {
  const now = new Date();
  document.getElementById('date-str').textContent =
    now.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

  const saved = localStorage.getItem(STORAGE_ITEMS);
  items = saved ? JSON.parse(saved) : [...DEFAULTS];

  const doneData = JSON.parse(localStorage.getItem(STORAGE_DONE) || '{}');
  const todayDone = doneData[todayKey()] || [];
  doneSet = new Set(todayDone);

  buildNumpad();
  render();
  updateProgress();
  bindButtons();

  // iOS 提示
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (isIOS && !isStandalone) {
    document.getElementById('ios-banner').style.display = 'block';
  }
}

// ══════════════════════════════════════
//  綁定所有按鈕（統一在 init 後執行）
// ══════════════════════════════════════
function bindButtons() {
  // 底部三個按鈕
  tap(document.getElementById('btn-reset'),   () => resetDay());
  tap(document.getElementById('btn-edit'),    () => {
    if (editMode) {
      deactivateEditMode();
    } else {
      showPwdPanel();
    }
  });
  tap(document.getElementById('btn-history'), () => showHistory());

  // 慶祝畫面關閉
  tap(document.getElementById('celebrate-close-btn'), () => closeCelebrate());

  // 歷史面板關閉
  tap(document.getElementById('close-history-btn'), () => closeHistoryPanel());
  tap(document.getElementById('history-overlay'), (e) => {
    if (e.target === document.getElementById('history-overlay')) closeHistoryPanel();
  });

  // 密碼面板取消
  tap(document.getElementById('close-pwd-btn'), () => closePwdPanel());
  tap(document.getElementById('pwd-overlay'), (e) => {
    if (e.target === document.getElementById('pwd-overlay')) closePwdPanel();
  });

  // Icon 選擇器關閉
  tap(document.getElementById('close-icon-btn'), () => closeIconPicker());
  tap(document.getElementById('icon-overlay'), (e) => {
    if (e.target === document.getElementById('icon-overlay')) closeIconPicker();
  });

  // 新增任務按鈕
  tap(document.getElementById('add-item-btn'), () => addItem());

  // Enter 鍵新增
  document.getElementById('new-item-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && editMode) addItem();
  });
}

// ══════════════════════════════════════
//  儲存
// ══════════════════════════════════════
function saveItems() {
  localStorage.setItem(STORAGE_ITEMS, JSON.stringify(items));
}

function saveDone() {
  const doneData = JSON.parse(localStorage.getItem(STORAGE_DONE) || '{}');
  doneData[todayKey()] = [...doneSet];
  localStorage.setItem(STORAGE_DONE, JSON.stringify(doneData));
}

function saveHistory() {
  const hist = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
  const today = todayKey();
  const existing = hist.findIndex(h => h.date === today);
  const entry = {
    date: today,
    items: items.map((item, i) => ({ text: item.text, done: doneSet.has(i) }))
  };
  if (existing >= 0) hist[existing] = entry;
  else hist.unshift(entry);
  localStorage.setItem(STORAGE_HISTORY, JSON.stringify(hist.slice(0, 30)));
}

// ══════════════════════════════════════
//  滑動手勢綁定
// ══════════════════════════════════════
function bindSlideGesture(card, idx) {
  const handle = card.querySelector('.check-circle');
  const fill   = card.querySelector('.slide-fill');
  const hint   = card.querySelector('.slide-hint');
  let startX = 0, startY = 0, maxSlide = 0, currentX = 0;
  let isDragging = false, dirLocked = false;

  function applyDrag(dx) {
    const clamped = Math.max(0, Math.min(dx, maxSlide));
    currentX = clamped;
    handle.style.transform = `translateX(${clamped}px)`;
    fill.style.width = (clamped / maxSlide * 100) + '%';
    if (hint) hint.style.opacity = 1 - clamped / maxSlide * 1.5;
  }

  function onCommit() {
    handle.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
    fill.style.transition = 'width .3s ease';
    handle.style.transform = `translateX(${maxSlide}px)`;
    fill.style.width = '100%';
    setTimeout(() => toggleItem(idx), 300);
  }

  function onSnapBack() {
    handle.style.transition = 'transform .45s cubic-bezier(.34,1.56,.64,1)';
    fill.style.transition = 'width .45s cubic-bezier(.34,1.56,.64,1)';
    handle.style.transform = 'translateX(0)';
    fill.style.width = '0%';
    if (hint) hint.style.opacity = 1;
    currentX = 0;
  }

  // Touch
  handle.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    isDragging = false;
    dirLocked = false;
    currentX = 0;
  }, { passive: true });

  handle.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if (!dirLocked) {
      dirLocked = true;
      if (Math.abs(dy) > Math.abs(dx)) return; // vertical scroll wins
      isDragging = true;
      maxSlide = card.offsetWidth - 120;
      handle.style.transition = 'none';
      fill.style.transition = 'none';
    }
    if (!isDragging) return;
    applyDrag(dx);
  }, { passive: true });

  handle.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    if (currentX >= maxSlide * 0.6) onCommit();
    else onSnapBack();
  }, { passive: true });

  // Mouse (desktop testing)
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const mStartX = e.clientX;
    maxSlide = card.offsetWidth - 120;
    handle.style.transition = 'none';
    fill.style.transition = 'none';
    currentX = 0;

    const onMove = (e) => applyDrag(e.clientX - mStartX);
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      if (currentX >= maxSlide * 0.6) onCommit();
      else onSnapBack();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

// ══════════════════════════════════════
//  渲染
// ══════════════════════════════════════
function render() {
  const wrap = document.getElementById('list-wrap');
  wrap.innerHTML = '';
  if (editMode) wrap.classList.add('edit-mode');
  else wrap.classList.remove('edit-mode');

  items.forEach((item, i) => {
    const done = doneSet.has(i);
    const card = document.createElement('div');
    card.className = 'item-card' + (done ? ' done' : '');
    card.style.animationDelay = (i * 0.06) + 's';

    if (editMode) {
      card.classList.add('edit-card');
      card.innerHTML = `
        <div class="check-circle">
          <span class="item-icon">${item.icon}</span>
        </div>
        <input class="item-name-input" type="text" value="${item.text}" maxlength="20"/>
        <button class="item-delete" data-idx="${i}">❌</button>
      `;
    } else {
      card.innerHTML = `
        <div class="slide-fill"></div>
        <div class="check-circle">
          <span class="item-icon">${item.icon}</span>
        </div>
        <div class="item-text">${item.text}</div>
        ${!done ? '<span class="slide-hint">→→</span>' : ''}
        <button class="item-delete" data-idx="${i}">❌</button>
      `;
    }

    // 完成狀態：點卡片取消；未完成：滑動把手完成
    if (!editMode) {
      if (done) {
        tap(card, () => toggleItem(i));
      } else {
        bindSlideGesture(card, i);
      }
    }

    // 編輯模式：點 check-circle 選 icon
    const circle = card.querySelector('.check-circle');
    tap(circle, (e) => {
      if (!editMode) return;
      e.stopPropagation();
      showIconPicker(i);
    });

    // 編輯模式：名稱輸入框即時儲存
    if (editMode) {
      const input = card.querySelector('.item-name-input');
      input.addEventListener('input', () => {
        items[i].text = input.value;
        saveItems();
      });
      input.addEventListener('click', (e) => e.stopPropagation());
      input.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    }

    // 刪除按鈕
    const delBtn = card.querySelector('.item-delete');
    tap(delBtn, (e) => {
      e.stopPropagation();
      deleteItem(i);
    });

    wrap.appendChild(card);
  });

  document.getElementById('add-wrap').style.display = editMode ? 'flex' : 'none';
}

// ══════════════════════════════════════
//  勾選
// ══════════════════════════════════════
function toggleItem(i) {
  if (editMode) return;
  if (doneSet.has(i)) doneSet.delete(i);
  else doneSet.add(i);

  saveDone();
  saveHistory();
  render();
  updateProgress();

  if (doneSet.size === items.length && items.length > 0 && !celebrated) {
    celebrated = true;
    setTimeout(showCelebrate, 400);
  }
}

// ══════════════════════════════════════
//  進度條
// ══════════════════════════════════════
function updateProgress() {
  const pct = items.length ? Math.round(doneSet.size / items.length * 100) : 0;
  document.getElementById('progress-bar').style.width = pct + '%';

  const label = document.getElementById('progress-label');
  if (pct === 0)        label.textContent = '還沒開始，加油！💪';
  else if (pct < 50)    label.textContent = `完成 ${doneSet.size} / ${items.length} 項，繼續！🔥`;
  else if (pct < 100)   label.textContent = `快到了！還差 ${items.length - doneSet.size} 項！⚡`;
  else                  label.textContent = '🎉 全部完成！你好棒！';
}

// ══════════════════════════════════════
//  編輯模式
// ══════════════════════════════════════
function activateEditMode() {
  editMode = true;
  const btn = document.getElementById('btn-edit');
  btn.textContent = '✅ 完成';
  btn.classList.add('active');
  render();
}

function deactivateEditMode() {
  editMode = false;
  const btn = document.getElementById('btn-edit');
  btn.textContent = '✏️ 編輯';
  btn.classList.remove('active');
  render();
}

function deleteItem(i) {
  items.splice(i, 1);
  const newDone = new Set();
  doneSet.forEach(idx => {
    if (idx < i) newDone.add(idx);
    else if (idx > i) newDone.add(idx - 1);
  });
  doneSet = newDone;
  saveItems();
  saveDone();
  render();
  updateProgress();
}

function addItem() {
  const input = document.getElementById('new-item-input');
  const text = input.value.trim();
  if (!text) return;
  const icon = ICONS[Math.floor(Math.random() * ICONS.length)];
  items.push({ icon, text });
  input.value = '';
  saveItems();
  render();
  updateProgress();
}

// ══════════════════════════════════════
//  Icon 選擇器
// ══════════════════════════════════════
let iconPickerTarget = -1;

function showIconPicker(itemIdx) {
  iconPickerTarget = itemIdx;
  const container = document.getElementById('icon-picker-grid');
  container.innerHTML = '';
  ICON_CATEGORIES.forEach(cat => {
    const section = document.createElement('div');
    section.className = 'icon-category';
    const title = document.createElement('div');
    title.className = 'icon-category-title';
    title.textContent = cat.label;
    section.appendChild(title);
    const grid = document.createElement('div');
    grid.className = 'icon-picker-grid';
    cat.icons.forEach(icon => {
      const btn = document.createElement('button');
      btn.className = 'icon-option' + (items[itemIdx].icon === icon ? ' selected' : '');
      btn.textContent = icon;
      tap(btn, () => {
        items[itemIdx].icon = icon;
        saveItems();
        closeIconPicker();
        render();
      });
      grid.appendChild(btn);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
  document.getElementById('icon-overlay').classList.add('open');
}

function closeIconPicker() {
  document.getElementById('icon-overlay').classList.remove('open');
  iconPickerTarget = -1;
}

// ══════════════════════════════════════
//  重置
// ══════════════════════════════════════
function resetDay() {
  if (!confirm('要重新開始今天的任務嗎？')) return;
  doneSet.clear();
  celebrated = false;
  saveDone();
  saveHistory();
  render();
  updateProgress();
}

// ══════════════════════════════════════
//  慶祝
// ══════════════════════════════════════
function showCelebrate() {
  const el = document.getElementById('celebrate');
  el.classList.add('show');
  spawnConfetti();
}

function closeCelebrate() {
  document.getElementById('celebrate').classList.remove('show');
}

function spawnConfetti() {
  const colors = ['#f97316','#fbbf24','#22c55e','#3b82f6','#ec4899','#a855f7'];
  const el = document.getElementById('celebrate');
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.cssText = `
      left: ${Math.random() * 100}%;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-duration: ${1.5 + Math.random() * 2}s;
      animation-delay: ${Math.random() * 1.5}s;
      width: ${8 + Math.random() * 10}px;
      height: ${8 + Math.random() * 10}px;
      border-radius: ${Math.random() > .5 ? '50%' : '3px'};
    `;
    el.appendChild(c);
  }
}

// ══════════════════════════════════════
//  歷史紀錄
// ══════════════════════════════════════
function showHistory() {
  const hist = JSON.parse(localStorage.getItem(STORAGE_HISTORY) || '[]');
  const container = document.getElementById('history-list');
  if (!hist.length) {
    container.innerHTML = '<p style="text-align:center;color:#78716c;font-weight:700;padding:20px">還沒有紀錄喔！</p>';
  } else {
    container.innerHTML = hist.map(h => `
      <div class="history-day">
        <div class="history-day-title">📅 ${h.date}
          （${h.items.filter(i=>i.done).length}/${h.items.length} 完成）
        </div>
        ${h.items.map(i => `
          <div class="history-item ${i.done ? 'done-item' : ''}">
            ${i.done ? '✅' : '⬜'} ${i.text}
          </div>
        `).join('')}
      </div>
    `).join('');
  }
  document.getElementById('history-overlay').classList.add('open');
}

function closeHistoryPanel() {
  document.getElementById('history-overlay').classList.remove('open');
}

// ══════════════════════════════════════
//  Service Worker
// ══════════════════════════════════════
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(console.warn);
}

// ══════════════════════════════════════
//  啟動
// ══════════════════════════════════════
init();
</script>
</body>
</html>
